[package]
name = "hx-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hx-core.workspace = true
hx-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
base64.workspace = true
russh.workspace = true
hmac.workspace = true
sha1.workspace = true
# NTLM, which a WinRM connection to a workgroup Windows host authenticates with. `md5` and `hmac`
# are already in the workspace lock; `md4` is not, so it is implemented in `ntlm.rs` rather than
# added — it is ~40 lines, used for exactly one thing (the NT hash), and the offline gate will not
# fetch a crate for it.
md5.workspace = true
getrandom.workspace = true
# WinRM is SOAP over HTTP, so its transport is an HTTP client rather than a socket.
reqwest.workspace = true
# Unix-only: process-group kill on command timeouts. `target`-gated so non-Unix builds
# (Windows uses `taskkill /T`) do not link it.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
