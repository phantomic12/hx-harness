<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hx</title>
<!--
  The hx web client.

  One file, no build step and no bundler. The daemon serves it directly, so there is no toolchain
  between a change and seeing it, and no `node_modules` for a deploy to get wrong. xterm.js is the
  one dependency and it comes from a CDN; if that is unavailable the terminal pane says so rather
  than silently rendering nothing.

  This is a *client*. It owns no state the daemon does not: the session, its events, the terminal,
  and its scrollback all live in `hxd`. Closing this tab must not lose any of them, which is why
  the terminal is created once by id and reattached rather than recreated on every connect — and
  why the reconnect logic asks for `since_seq` rather than assuming a fresh stream.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --line: #2b3038;
    --text: #d7dae0;
    --dim: #8b93a3;
    --accent: #6aa9ff;
    --good: #7ddc8a;
    --bad: #ff8080;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: none;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .status { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--good); }
  main { flex: 1; display: flex; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: 1; }
  .pane + .pane { border-left: 1px solid var(--line); }
  .pane > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim);
    margin: 0; padding: 6px 12px; border-bottom: 1px solid var(--line); flex: none;
    font-weight: 600; display: flex; justify-content: space-between; align-items: center;
  }
  .pane > h2 button {
    font: inherit; font-size: 11px; text-transform: none; letter-spacing: 0;
    background: transparent; color: var(--dim); border: 1px solid var(--line);
    border-radius: 4px; padding: 2px 7px; cursor: pointer;
  }
  .pane > h2 button:hover { color: var(--text); border-color: var(--accent); }
  #terminal { flex: 1; min-height: 0; padding: 6px 0 6px 8px; }
  #events { flex: 1; overflow-y: auto; padding: 10px 12px; font-size: 13px; }
  .event { padding: 4px 0; border-bottom: 1px solid rgba(43,48,56,.5); }
  .event .kind { color: var(--accent); font-weight: 600; }
  .event .seq { color: var(--dim); font-size: 11px; margin-right: 6px; }
  .event pre {
    margin: 4px 0 0; white-space: pre-wrap; word-break: break-word;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: var(--dim);
  }
  .composer { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); flex: none; }
  .composer input {
    flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 7px 10px; font: inherit;
  }
  .composer input:focus { outline: none; border-color: var(--accent); }
  .composer button {
    background: var(--accent); color: #0b1220; border: 0; border-radius: 5px;
    padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .composer button:disabled { opacity: .5; cursor: default; }
  .error { color: var(--bad); font-size: 12px; padding: 0 12px 8px; }
  .scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .approval { border-bottom: 1px solid var(--line); padding: 10px 12px; }
  .approval .risk {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .6px;
    font-weight: 700; padding: 2px 6px; border-radius: 3px; margin-bottom: 6px;
  }
  .risk.low { background: rgba(125,220,138,.15); color: var(--good); }
  .risk.medium { background: rgba(255,208,110,.15); color: #ffd06e; }
  .risk.high, .risk.critical { background: rgba(255,128,128,.18); color: var(--bad); }
  .approval .tool { font-weight: 600; }
  .approval .summary { color: var(--text); margin: 4px 0; font-size: 13px; }
  .approval .reason { color: var(--dim); font-size: 12px; }
  .approval .undo { color: var(--dim); font-size: 12px; font-style: italic; margin-top: 3px; }
  .approval .opts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .approval .opts button {
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 4px; cursor: pointer;
    background: transparent; color: var(--text); border: 1px solid var(--line);
  }
  .approval .opts button:hover { border-color: var(--accent); }
  .approval .opts button.deny { color: var(--bad); }
  .approval .opts button.deny:hover { border-color: var(--bad); }
  .empty { color: var(--dim); font-size: 12px; padding: 12px; }
  .sandbox {
    padding: 6px 12px; font-size: 12px; color: var(--dim);
    border-bottom: 1px solid var(--line); flex: none;
  }
  .sandbox .live { color: var(--good); }
  .sandbox .off { color: var(--bad); }
  #hosts { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 13px; }
  .host { padding: 6px 0; border-bottom: 1px solid rgba(43,48,56,.5); }
  .host .hid { font-weight: 600; color: var(--text); }
  .host .kind {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .6px;
    font-weight: 700; padding: 1px 5px; border-radius: 3px; margin-left: 6px;
    background: rgba(106,169,255,.15); color: var(--accent);
  }
  .host .desc { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .host .unconf { color: var(--bad); font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>
<header>
  <h1>hx</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status-text">connecting…</span></div>
</header>
<main>
  <section class="pane">
    <h2>hosts<span id="host-count"></span></h2>
    <div id="hosts" class="scroll"></div>
  </section>
  <section class="pane">
    <h2>terminal<span><button id="new-term">new</button></span></h2>
    <div id="terminal"></div>
  </section>
  <section class="pane">
    <h2>approvals<span id="approval-count"></span></h2>
    <div id="sandbox-status" class="sandbox"></div>
    <div id="approvals" class="scroll"></div>
    <div class="error" id="approval-error"></div>
  </section>
  <section class="pane">
    <h2>session<span id="session-label"></span></h2>
    <div id="events"></div>
    <div class="composer">
      <input id="prompt" placeholder="Ask the agent…" autocomplete="off">
      <button id="send">Send</button>
    </div>
    <div class="error" id="error"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
"use strict";

// Same origin: the daemon serves this file and the API, so there is no host to configure and no
// CORS to arrange.
const API = "";
const wsURL = (path) => {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return `${proto}//${location.host}${path}`;
};

const $ = (id) => document.getElementById(id);
const setStatus = (text, ok) => {
  $("status-text").textContent = text;
  $("dot").classList.toggle("on", !!ok);
};
const showError = (msg) => { $("error").textContent = msg || ""; };

// ---------------------------------------------------------------------------------------------
// Terminal

let term = null, fit = null, termSocket = null, terminalId = null;
let termReconnectDelay = 250;

function initTerm() {
  if (typeof Terminal === "undefined") {
    // The CDN is the one external dependency. Say so instead of leaving a blank pane that looks
    // like a broken shell.
    $("terminal").innerHTML =
      '<p style="color:#ff8080;font-size:12px;padding:8px">' +
      "xterm.js could not be loaded from the CDN — check network access.</p>";
    return false;
  }
  term = new Terminal({
    cursorBlink: true,
    fontFamily: 'ui-monospace, "SF Mono", Menlo, monospace',
    fontSize: 13,
    theme: { background: "#14161a", foreground: "#d7dae0", cursor: "#6aa9ff" },
    scrollback: 5000,
  });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($("terminal"));
  fit.fit();

  // Typing goes to the daemon, not to a local shell: the PTY is server-side, which is what lets a
  // second client share this terminal.
  term.onData((data) => {
    if (termSocket && termSocket.readyState === WebSocket.OPEN) {
      termSocket.send(JSON.stringify({ type: "input", data: b64encode(data) }));
    }
  });
  // Resizing the window resizes the *shell*, so full-screen programs redraw correctly.
  term.onResize(({ cols, rows }) => sendResize(cols, rows));
  new ResizeObserver(() => { try { fit.fit(); } catch (_) {} }).observe($("terminal"));
  window.addEventListener("resize", () => { try { fit.fit(); } catch (_) {} });
  return true;
}

function sendResize(cols, rows) {
  if (termSocket && termSocket.readyState === WebSocket.OPEN && cols > 0 && rows > 0) {
    termSocket.send(JSON.stringify({ type: "resize", cols, rows }));
  }
}

// Terminal bytes are not text: escape sequences and partial UTF-8 sequences split across reads
// must survive exactly, so input is base64 and output is decoded back to bytes before xterm sees it.
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
function b64decodeToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function ensureTerminal() {
  // Reuse the terminal across reloads: `hx-term` is a fixed id, so a page refresh reattaches to the
  // shell that is already running instead of starting a second one. A terminal that is gone (the
  // shell exited) is recreated, which the POST below does on a 409.
  terminalId = terminalId || "hx-term";
  const res = await fetch(`${API}/v1/terminals`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ id: terminalId, cols: term ? term.cols : 80, rows: term ? term.rows : 24 }),
  });
  // 200 = created; anything else may mean it already exists, which is fine — attach and find out.
  if (res.status !== 200) {
    const list = await fetch(`${API}/v1/terminals`).then((r) => r.json()).catch(() => ({}));
    if (!(list.terminals || []).includes(terminalId)) {
      const body = await res.text();
      throw new Error(`could not create a terminal: ${body}`);
    }
  }
  attachTerminal();
}

function attachTerminal() {
  if (termSocket) { try { termSocket.close(); } catch (_) {} }
  termSocket = new WebSocket(wsURL(`/v1/terminals/${terminalId}/ws`));

  termSocket.onopen = () => {
    termReconnectDelay = 250;
    sendResize(term.cols, term.rows);
    term.focus();
  };
  termSocket.onmessage = (ev) => {
    let frame;
    try { frame = JSON.parse(ev.data); } catch (_) { return; }
    switch (frame.type) {
      case "scrollback":
        // History, sent before any live output. Cleared first so a reattaching client does not
        // append to what it already rendered.
        term.reset();
        term.write(b64decodeToBytes(frame.data));
        break;
      case "output":
        term.write(b64decodeToBytes(frame.data));
        break;
      case "lagged":
        // This client fell behind and frames were dropped *for it*. Said out loud, because a
        // terminal with a hole in it renders wrong from here on and looks like the shell's doing.
        term.write(`\r\n\x1b[33m[${frame.missed} frames dropped — the terminal is still running]\x1b[0m\r\n`);
        attachTerminal();
        break;
      case "exited":
        term.write(`\r\n\x1b[90m[shell exited${frame.code === null ? "" : ` with code ${frame.code}`}]\x1b[0m\r\n`);
        break;
      case "error":
        term.write(`\r\n\x1b[31m[${frame.message}]\x1b[0m\r\n`);
        break;
    }
  };
  termSocket.onclose = () => {
    // Reconnect with a backoff. The shell is still running server-side, so this is a failed
    // *attachment*, not a lost terminal — reattaching is the whole recovery.
    setTimeout(() => { if (terminalId) attachTerminal(); }, termReconnectDelay);
    termReconnectDelay = Math.min(termReconnectDelay * 2, 8000);
  };
  termSocket.onerror = () => { /* onclose handles it */ };
}

// ---------------------------------------------------------------------------------------------
// Session events

let sessionId = null, eventSocket = null, lastSeq = 0, eventReconnectDelay = 250;

function renderEvent(frame) {
  const el = document.createElement("div");
  el.className = "event";
  const event = frame.event || {};
  const kind = event.type || "event";
  const summary = summarize(event);
  el.innerHTML =
    `<span class="seq">#${frame.seq}</span><span class="kind"></span>` +
    (summary ? `<pre></pre>` : "");
  el.querySelector(".kind").textContent = kind;
  if (summary) el.querySelector("pre").textContent = summary;
  return el;
}

// A compact one-line-ish rendering: the raw event, minus the fields that are the same on every
// event of a kind. The full JSON is a click away, so nothing is hidden.
function summarize(event) {
  const clone = JSON.parse(JSON.stringify(event));
  delete clone.type;
  const keys = Object.keys(clone);
  if (keys.length === 0) return "";
  return JSON.stringify(clone);
}

async function ensureSession() {
  const res = await fetch(`${API}/v1/sessions`, { method: "POST" });
  if (res.status === 200 || res.status === 201) {
    const body = await res.json();
    sessionId = body.id || body.session;
  }
  if (!sessionId) {
    // Not every daemon build may accept a bare POST; fall back to the most recent session so the
    // pane still shows something real rather than an empty box.
    const list = await fetch(`${API}/v1/sessions`).then((r) => r.json()).catch(() => ({}));
    const items = list.sessions || list || [];
    if (Array.isArray(items) && items.length) sessionId = items[0].id || items[0];
  }
  if (!sessionId) throw new Error("could not open a session");
  $("session-label").textContent = sessionId;
  attachSession();
}

function attachSession() {
  if (eventSocket) { try { eventSocket.close(); } catch (_) {} }
  eventSocket = new WebSocket(wsURL(`/v1/sessions/${sessionId}/ws`));

  eventSocket.onopen = () => {
    eventReconnectDelay = 250;
    // Resume from the last event actually rendered. Without this a reconnect re-renders the entire
    // history, which looks like the session repeating itself.
    if (lastSeq > 0) eventSocket.send(JSON.stringify({ since_seq: lastSeq }));
  };
  eventSocket.onmessage = (ev) => {
    let frame;
    try { frame = JSON.parse(ev.data); } catch (_) { return; }
    if (typeof frame.seq === "number") {
      // The floor is what makes the resume exact: events at or below it were already rendered.
      if (frame.seq <= lastSeq) return;
      lastSeq = frame.seq;
    }
    $("events").appendChild(renderEvent(frame));
    $("events").scrollTop = $("events").scrollHeight;
  };
  eventSocket.onclose = () => {
    setTimeout(() => { if (sessionId) attachSession(); }, eventReconnectDelay);
    eventReconnectDelay = Math.min(eventReconnectDelay * 2, 8000);
  };
}

// ---------------------------------------------------------------------------------------------
// Prompting

async function sendPrompt() {
  const input = $("prompt");
  const prompt = input.value.trim();
  if (!prompt || !sessionId) return;
  input.value = "";
  $("send").disabled = true;
  showError("");
  try {
    const res = await fetch(`${API}/v1/chat`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ session: sessionId, prompt, stream: false }),
    });
    if (!res.ok) throw new Error(`chat failed: ${res.status} ${await res.text()}`);
    // The answer's events arrive on the session socket like any other, so there is nothing to
    // render here — doing it here too would double every event.
  } catch (e) {
    showError(String(e.message || e));
  } finally {
    $("send").disabled = false;
    $("prompt").focus();
  }
}

// ---------------------------------------------------------------------------------------------
// Approvals

// Polled rather than pushed. An approval is rare and a second of latency costs nothing, while a
// push channel would be a second socket to keep alive and reconnect for something that mostly has
// nothing to say. If this ever polls a busy daemon, that trade should be revisited — not before.
const APPROVAL_POLL_MS = 2000;
let approvalTimer = null;

/// The sandbox state, shown above the approval list.
///
/// It sits here because the two are read together: an approval is often *about* running something,
/// and whether the daemon can run it at all — no container engine, or every slot taken — is the
/// context that decides how to answer. Hidden when unavailable is the wrong call: "sandboxes are
/// off" is exactly what a person needs to know before wondering why their build never starts.
async function pollSandboxes() {
  const host = $("sandbox-status");
  try {
    // `/v1/status`, not `/v1/sandboxes`: the latter returns the list of *live containers*, while
    // the summary this strip renders — availability, slots, the reason — is part of the status
    // snapshot. Reading the list route would leave the strip permanently blank, which looks the
    // same as a daemon with no container engine.
    const res = await fetch(`${API}/v1/status`);
    if (!res.ok) throw new Error(`${res.status}`);
    const s = (await res.json()).sandboxes || {};
    host.innerHTML = "";
    const span = document.createElement("span");
    if (s.available) {
      span.className = "live";
      const slots = s.free_slots === undefined || s.free_slots === null ? "?" : s.free_slots;
      const max = s.max_concurrent === undefined || s.max_concurrent === null ? "?" : s.max_concurrent;
      span.textContent = `sandboxes: ${s.live} live, ${slots}/${max} slots free`;
    } else {
      span.className = "off";
      // The reason is shown verbatim. "unavailable" alone sends someone to read logs; the daemon
      // already knows why — a missing socket, no engine — and that sentence is the whole value here.
      span.textContent = `sandboxes unavailable${s.reason ? `: ${s.reason}` : ""}`;
    }
    host.appendChild(span);
  } catch (e) {
    host.textContent = `sandbox state unknown: ${e.message || e}`;
  }
}

async function pollApprovals() {
  try {
    const res = await fetch(`${API}/v1/approvals`);
    if (!res.ok) throw new Error(`${res.status}`);
    const items = await res.json();
    renderApprovals(Array.isArray(items) ? items : []);
    $("approval-error").textContent = "";
  } catch (e) {
    $("approval-error").textContent = `approvals unavailable: ${e.message || e}`;
  }
}

function renderApprovals(items) {
  const host = $("approvals");
  $("approval-count").textContent = items.length ? `${items.length}` : "";
  // Rebuilt wholesale: the list is small and every field can change, so a diff would be more
  // machinery than the thing it optimises.
  host.innerHTML = "";
  if (items.length === 0) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "Nothing waiting.";
    host.appendChild(p);
    return;
  }
  for (const req of items) host.appendChild(renderApproval(req));
}

function renderApproval(req) {
  const el = document.createElement("div");
  el.className = "approval";

  const risk = document.createElement("span");
  const riskClass = (req.risk || "medium").toString().toLowerCase();
  risk.className = `risk ${riskClass}`;
  // The risk class is a *string* here because the serialised enum may be a name or a tagged object;
  // rendering it plainly beats rendering `undefined` for a shape this does not recognise.
  risk.textContent = riskClass;
  el.appendChild(risk);

  const tool = document.createElement("div");
  tool.className = "tool";
  tool.textContent = req.tool || "tool";
  el.appendChild(tool);

  const summary = document.createElement("div");
  summary.className = "summary";
  summary.textContent = req.summary || "";
  el.appendChild(summary);

  const reason = document.createElement("div");
  reason.className = "reason";
  // The reason is the point of the pane: a prompt with no reason is one a person cannot answer
  // without guessing, and guessing is how a "yes" gets given to something nobody understood.
  reason.textContent = req.reason || "no reason given";
  el.appendChild(reason);

  if (req.undo) {
    const undo = document.createElement("div");
    undo.className = "undo";
    undo.textContent = `undo: ${req.undo}`;
    el.appendChild(undo);
  } else if (req.reversible === false) {
    const undo = document.createElement("div");
    undo.className = "undo";
    // Said explicitly, because "no undo line" must not read as "there is nothing more to know".
    undo.textContent = "this cannot be undone";
    el.appendChild(undo);
  }

  const opts = document.createElement("div");
  opts.className = "opts";
  // The wire values the daemon's route accepts, with the label a person reads. Kept as an explicit
  // table rather than passing through whatever the request carried: the route rejects anything
  // outside `once|chat|always|deny`, so sending the serialised option back would turn a working
  // button into a 400 depending on which enum shape the daemon happened to serialise.
  const OPTIONS = [
    { value: "once", label: "Allow once" },
    { value: "chat", label: "Allow for this chat" },
    { value: "always", label: "Always allow" },
    { value: "deny", label: "Deny" },
  ];
  // Only the options the daemon actually offered, so the pane cannot present a choice the policy
  // engine does not intend to honour.
  const offered = new Set(
    (req.options || []).map((o) =>
      (typeof o === "string" ? o : o.option || o.value || o.label || "").toString().toLowerCase()
    )
  );
  const known = (v) => offered.size === 0 || [...offered].some((o) => o.includes(v));
  for (const option of OPTIONS) {
    if (!known(option.value)) continue;
    const btn = document.createElement("button");
    btn.textContent = option.label;
    if (option.value === "deny") btn.className = "deny";
    btn.addEventListener("click", () => answerApproval(req.id, option.value));
    opts.appendChild(btn);
  }
  el.appendChild(opts);
  return el;
}

async function answerApproval(id, option) {
  try {
    const res = await fetch(`${API}/v1/approvals/${encodeURIComponent(id)}`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ option, by: "web" }),
    });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    // Answered immediately rather than waiting for the next poll, so the card does not sit there
    // looking unanswered after it has been decided.
    await pollApprovals();
  } catch (e) {
    $("approval-error").textContent = `could not answer: ${e.message || e}`;
  }
}

// ---------------------------------------------------------------------------------------------
// Hosts

// A host's "capability summary" is not in the wire shape: `/v1/hosts` returns the id, kind,
// address and configured flag (see HostSummary in state.rs), not the probed os/shell/auth. So the
// pane renders exactly the fields the daemon actually answers with, and says plainly when a host is
// declared but not configured, rather than inventing a capability line the API never sent.
async function pollHosts() {
  const host = $("hosts");
  try {
    const res = await fetch(`${API}/v1/hosts`);
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    const items = await res.json();
    if (!Array.isArray(items)) throw new Error("hosts is not a list");
    renderHosts(items);
  } catch (e) {
    // A failed fetch must not read as an empty farm: say it broke, out loud.
    host.innerHTML = "";
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = `hosts unknown: ${e.message || e}`;
    host.appendChild(p);
    $("host-count").textContent = "";
  }
}

function renderHosts(items) {
  const host = $("hosts");
  $("host-count").textContent = items.length ? `${items.length}` : "";
  host.innerHTML = "";
  if (items.length === 0) {
    // The daemon always lists the local machine, so this is the daemon answering with nothing at
    // all — distinguished from "here are the hosts" by being explicit.
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "No hosts are configured.";
    host.appendChild(p);
    return;
  }
  for (const h of items) host.appendChild(renderHost(h));
}

function renderHost(h) {
  const el = document.createElement("div");
  el.className = "host";

  const line = document.createElement("span");
  const hid = document.createElement("span");
  hid.className = "hid";
  // textContent, not innerHTML: the id comes from config, and a hostname that reads like markup
  // must not become markup.
  hid.textContent = h.id || "(unnamed)";
  line.appendChild(hid);

  if (h.kind) {
    const kind = document.createElement("span");
    kind.className = "kind";
    kind.textContent = h.kind;
    line.appendChild(kind);
  }
  el.appendChild(line);

  // `description` is a human-readable `user@host:port` for configured ssh/winrm hosts, or the
  // local machine's one-liner. Shown in place of a capability line because that is what the API
  // actually supplies.
  if (h.description && h.description !== "not configured") {
    const desc = document.createElement("div");
    desc.className = "desc";
    desc.textContent = h.description;
    el.appendChild(desc);
  }

  // `configured:false` means the host is declared in config but has no address, so it cannot be
  // connected to. Saying so beats showing a host that looks reachable.
  if (h.configured === false) {
    const unconf = document.createElement("div");
    unconf.className = "unconf";
    unconf.textContent = "declared but not configured — cannot connect";
    el.appendChild(unconf);
  }
  return el;
}

// ---------------------------------------------------------------------------------------------
// Boot

(async function main() {
  try {
    const health = await fetch(`${API}/healthz`).then((r) => r.text()).catch(() => null);
    setStatus(health ? "connected" : "daemon unreachable", !!health);
  } catch (_) {
    setStatus("daemon unreachable", false);
  }
  if (initTerm()) {
    try { await ensureTerminal(); } catch (e) { showError(String(e.message || e)); }
  }
  try { await ensureSession(); } catch (e) { showError(String(e.message || e)); }
  // Polled for the page's lifetime: an approval can arrive with no other activity, so there is no
  // event to hang the refresh off.
  await Promise.all([pollApprovals(), pollSandboxes(), pollHosts()]);
  approvalTimer = setInterval(() => {
    pollApprovals();
    pollSandboxes();
    pollHosts();
  }, APPROVAL_POLL_MS);
  window.addEventListener("beforeunload", () => clearInterval(approvalTimer));
})();

$("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter") sendPrompt(); });
$("send").addEventListener("click", sendPrompt);
$("new-term").addEventListener("click", async () => {
  // A *new* terminal, deliberately under a fresh id: the point of the `new` button is a second
  // shell, and reusing the id would just reattach to the first.
  const id = `hx-term-${Date.now().toString(36)}`;
  try {
    await fetch(`${API}/v1/terminals`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ id, cols: term.cols, rows: term.rows }),
    });
    terminalId = id;
    term.reset();
    attachTerminal();
  } catch (e) {
    showError(String(e.message || e));
  }
});
</script>
</body>
</html>
