[package]
name = "hx-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hx-egress-proxy"
path = "src/bin/egress_proxy.rs"

[dependencies]
hx-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
bollard.workspace = true
futures.workspace = true
http-body-util.workspace = true
http.workspace = true
hyper.workspace = true

# Firecracker speaks HTTP over a Unix domain socket; `hyperlocal` is Unix-only
# and does not compile on Windows (no `tokio::net::UnixListener/UnixStream`).
[target.'cfg(unix)'.dependencies]
hyperlocal.workspace = true
hyper-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
axum.workspace = true
# The live remote suite (`tests/remote_live.rs`) drives `SshHost` against a real host and
# `SandboxSpec`/`RemoteSandboxRuntime` in one process, so the test crate needs both crates.
# This is a `[dev-dependencies]` only — it never reaches the published library, which is exactly
# why it does not violate the module's no-`hx-remote`-in-the-library rule: the library edge
# is the inversion; a test that links the two together is what proves they fit.
hx-remote.workspace = true
hx-secrets.workspace = true
