[workspace]
resolver = "2"
members = [
    "crates/hx-core",
    "crates/hx-secrets",
    "crates/hx-store",
    "crates/hx-provider",
    "crates/hx-search",
    "crates/hx-remote",
    "crates/hx-sandbox",
    "crates/hx-browser",
    "crates/hx-mcp",
    "crates/hx-tools",
    "crates/hx-agent",
    "crates/hx-gateway",
    "crates/hx-server",
    "apps/hxd",
    "apps/hx",
    "apps/hx-desktop",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
# Distributed as binaries (GitHub Releases, ghcr.io) — not published to crates.io.
#
# Declaring that is what lets cargo-deny's `wildcards` lint pass honestly rather than being
# switched off: the lint exists because crates.io refuses path dependencies, and that cannot
# happen to a crate that is never uploaded. It also stops a stray `cargo publish` from
# pushing a half-configured crate. `cargo install --git` is unaffected — `publish` only
# gates the registry.
publish = false

[workspace.dependencies]
# internal
hx-core = { path = "crates/hx-core" }
hx-secrets = { path = "crates/hx-secrets" }
hx-store = { path = "crates/hx-store" }
hx-provider = { path = "crates/hx-provider" }
hx-search = { path = "crates/hx-search" }
hx-remote = { path = "crates/hx-remote" }
hx-sandbox = { path = "crates/hx-sandbox" }
hx-browser = { path = "crates/hx-browser" }
hx-mcp = { path = "crates/hx-mcp" }
hx-tools = { path = "crates/hx-tools" }
hx-agent = { path = "crates/hx-agent" }
hx-gateway = { path = "crates/hx-gateway" }
hx-server = { path = "crates/hx-server" }

# async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

# serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1.0"
toml = "1.0"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ids / time / misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
base64 = "0.23"
hex = "0.4"
bytes = "1"
indexmap = { version = "2", features = ["serde"] }
sha2 = "0.10"
regex = "1"
url = "2"

# crypto / secrets
argon2 = "0.6"
chacha20poly1305 = "0.11"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# http / server
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace", "cors", "compression-gzip"] }
# reqwest 0.13 dropped the `rustls-tls` feature; `rustls` replaces it.
#
# The mechanism changed underneath the name, which is worth knowing before trusting the old
# behaviour: 0.12's `rustls-tls` bundled Mozilla's roots via webpki, so HTTPS worked with no
# CA store on the host. 0.13 verifies through rustls-platform-verifier — the OS trust store.
# The practical consequence is that the release binaries now need a system CA bundle
# (ca-certificates) at runtime, which is why the Dockerfile installs it and DEPLOY.md calls
# it out. macOS and Windows use their native stores and need nothing extra.
#
# 0.13.1 still declares an optional `webpki-roots` dependency, but no code in the crate reads
# it — enabling it only adds an unused crate to the graph. Omitted rather than kept as
# cargo-cult.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip"] }

# storage
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }

# remote / sandbox
russh = "0.63"
russh-keys = "0.49"
# `known_hosts` hashed host fields are HMAC-SHA1 — the format on disk, not a choice. Same
# versions `russh` already pulls in, so this adds no new crate to the graph.
hmac = "0.13"
sha1 = "0.11"
# NTLM's password hash. Already in the lock (via `russh`'s dependencies), so this promotes it
# rather than adding a crate to the graph.
md5 = "0.8"
bollard = "0.21"

# mcp
rmcp = { version = "3.3", features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "schemars"] }

# cli / tui
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"

# testing
tempfile = "3"
tokio-test = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

# dev builds get fast linking via clippy-friendly settings
[profile.dev]
debug = 1
