name: Docker

# Publishes ghcr.io/phantomic12/hx-harness.
#
# On pull requests this only builds — no login, no push — so a broken Dockerfile is caught
# before merge. main and version tags get published; a semver tag also gets immutable
# minor/major aliases so people can pin `:0.1` or `:0` and still receive patches.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build${{ github.event_name == 'pull_request' && '' || ' + push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Metadata runs on PRs too: it derives tags without pushing, so the log shows
      # exactly what would have been published.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only for now. Adding linux/arm64 under QEMU makes every build several
          # minutes slower; the arm64 story is served better by the native static binary
          # from the release workflow (and `cargo install`).
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
