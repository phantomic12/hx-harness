name: CI

# The three checks that gate every change: formatting, lints, and the test suite.
#
# `cargo test` here runs 384 in-process unit tests with no external dependencies, plus 13
# `#[ignore]`d integration tests that need a real SSH server or a real container engine — those
# run in `integration.yml`, which is where tier A lives.
# Read TESTING.md before trusting a green badge: it separates "executed against a real service"
# from "unit-tested" from "merely compiles", and nothing in this file reaches tier A.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the previous run obsolete. Cancel it rather than paying for
# a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are worthless in CI (every run starts cold) and cost cache space.
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # No cache: this is seconds of work, and a cache restore would cost more.
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # hx-desktop (Tauri/GTK) links glib-2.0 via glib-sys, which shells out to
      # pkg-config at build time. The stock runner image ships no GTK dev
      # libraries, so install the webkit2gtk stack before linting.
      - name: Install GTK system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev \
            libgtk-3-dev libglib2.0-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      # --all-targets so test code is linted too — a warning in a test is still a warning.
      # -D warnings makes the build fail rather than printing advice into a log nobody reads.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide whether the other two pass.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # hx-desktop (Tauri/GTK) needs the webkit2gtk dev stack on Linux; macOS
      # and Windows runners already provide what glib-sys needs via their own
      # toolchains, so only install on ubuntu.
      - name: Install GTK system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev \
            libgtk-3-dev libglib2.0-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      # chromium_rung integration tests drive a real Chromium over CDP; the rung
      # hardcodes /usr/lib/chromium/chromium, and the tests self-skip if it's absent.
      - name: Install Chromium (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y chromium
      # --locked fails if Cargo.lock is out of date with the manifests. That is deliberate:
      # an un-updated lockfile is a real bug, and better caught here than by a user.
      - run: cargo test --workspace --locked

  # Verifies the `rust-version` in Cargo.toml is honest.
  #
  # The floor is read out of the manifest instead of being repeated here, so the declared
  # value and the tested value cannot drift apart. This job is what makes the claim true or
  # false — if it fails, raise the declared version; don't delete the job. It earned its keep
  # on the first run: the manifest claimed 1.82 while `russh` had required 1.89 for a while,
  # so anyone trusting the old number would have landed on a toolchain that cannot build this.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read declared MSRV from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$v" ]; then
            echo "::error::workspace manifest declares no rust-version"
            exit 1
          fi
          echo "Declared MSRV: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
      # Same GTK dev stack as clippy: `cargo check` builds hx-desktop's
      # glib-sys build script, which fails without glib-2.0 pkg-config files.
      - name: Install GTK system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev \
            libgtk-3-dev libglib2.0-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      # Printed so the log records which toolchain actually ran, not just which was asked for.
      - run: rustc --version
      - run: cargo check --workspace --all-targets --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Advisories (known CVEs), license compliance, and dependency provenance.
      # Config in deny.toml.
      - run: cargo deny check
