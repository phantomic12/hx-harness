name: Integration

# The tests that need a real server, and therefore the only tests that reach tier A.
#
# `ci.yml` runs in-process unit tests: a green run there proves the logic, not that anything
# connects. Everything in this file opens a real socket — an SSH handshake against a real sshd, a
# container against a real daemon. Without this workflow those tests were run by hand or not at
# all, so a regression in the transport or the isolation ladder was invisible until someone
# happened to try it in anger.
#
# They are still `#[ignore]`d in the default `cargo test`, deliberately: a developer without Docker
# should get a green suite and an honest count, not a failure they cannot act on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The isolation ladder is the containment story, and until this job existed none of it had ever
  # met an engine. The first run found two settings the daemon rejects outright (`userns=keep-id`
  # and `seccomp=default`), which had made every L2/L3 sandbox impossible to start while the unit
  # suite stayed green.
  docker:
    name: sandbox lifecycle (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pulled here rather than by the tests: the tests must not depend on the network, so a
      # missing image has to be a failing test instead of a hang. Ubuntu is the image the repo
      # uses everywhere else.
      - run: docker pull ubuntu:24.04

      - name: Install gVisor, so L3 is testable
        # L3's claim is that the sandbox never sees the host kernel, and that is only checkable where
        # a VM-backed runtime exists. Installing it here is what stops the strongest claim in the
        # ladder from quietly skipping — `HX_DOCKER_REQUIRE_L3` below turns a skip into a failure.
        env:
          # Pinned deliberately: an unpinned download means a gVisor release can change this job's
          # outcome without anything in this repo changing.
          GISVOR_VERSION: "20260914.0"
        run: |
          # Two attempts at this URL were wrong before landing here, and both failed in ways that
          # looked like a broken gVisor rather than a wrong download:
          #
          # 1. `releases/release/latest/x86_64/runsc` — upstream removed it and it 404s.
          # 2. `releases/release/runsc/x86_64/runsc` — a *stale* 2022 artifact that still answers.
          #    It installed cleanly and `runsc --version` said `release-20220208.0`, then every
          #    container failed with `runsc did not terminate successfully: exit status 1`.
          #
          # A release now ships as a versioned tarball with the runtime and its helper binaries, so
          # take it from the version directory rather than a mutable alias.
          curl -fsSL -o /tmp/gvisor.tar.zstd "https://storage.googleapis.com/gvisor/releases/release/${GISVOR_VERSION}/x86_64/gvisor.tar.zstd"
          curl -fsSL -o /tmp/gvisor.tar.zstd.sha512 "https://storage.googleapis.com/gvisor/releases/release/${GISVOR_VERSION}/x86_64/gvisor.tar.zstd.sha512"
          (cd /tmp && sha512sum -c gvisor.tar.zstd.sha512)
          mkdir -p /tmp/gvisor && tar --zstd -xf /tmp/gvisor.tar.zstd -C /tmp/gvisor
          sudo install -m 0755 /tmp/gvisor/runsc /usr/local/bin/runsc
          # The shim and the sidecar binaries have to be installed too. A current `runsc` looks for
          # `gvisor-bin/` next to itself and fails the container outright without it:
          #
          #   sidecar "gvisor_sentry" not usable (stat /usr/local/bin/gvisor-bin/gvisor_sentry:
          #   no such file or directory) and --sidecar-usage-policy is set to STRICT
          #
          # which is a newer requirement than the 2022 build this job used to get, and reads as a
          # broken runtime rather than an incomplete install.
          sudo install -m 0755 /tmp/gvisor/containerd-shim-runsc-v1 /usr/local/bin/containerd-shim-runsc-v1
          sudo mkdir -p /usr/local/bin/gvisor-bin
          sudo cp -a /tmp/gvisor/gvisor-bin/. /usr/local/bin/gvisor-bin/
          sudo chmod 0755 /usr/local/bin/gvisor-bin/*
          # Merge into `daemon.json` rather than replacing it. Writing the key alone clobbers
          # whatever the installer put there — the default runtime and the shim paths `containerd`
          # needs — and `runsc` then fails to launch with `did not terminate successfully: exit
          # status 1`, which reads as a broken gVisor rather than a damaged daemon config.
          sudo python3 - <<'PY'
          import json
          path = "/etc/docker/daemon.json"
          try:
              with open(path) as f:
                  cfg = json.load(f)
          except (FileNotFoundError, ValueError):
              cfg = {}
          cfg.setdefault("runtimes", {})["runsc"] = {"path": "/usr/local/bin/runsc"}
          with open(path, "w") as f:
              json.dump(cfg, f, indent=2)
          print("daemon.json:", json.dumps(cfg))
          PY
          sudo systemctl restart docker

          # Assert the runtime answers before any test does: "no gVisor" must fail here, naming the
          # reason, rather than downstream as a mysterious L3 assertion.
          docker info --format '{{range $k,$v := .Runtimes}}{{$k}} {{end}}'
          # Print the version, so a future stale-download regression is visible as a date rather than
          # as an unexplained container failure.
          runsc --version
          docker run --rm --runtime runsc --network none ubuntu:24.04 uname -r

      - name: The ladder, against a real container engine
        env:
          # A skip is not a pass: if gVisor vanishes from this environment, fail.
          HX_DOCKER_REQUIRE_L3: "1"
        run: cargo test -p hx-sandbox --test docker_live --locked -- --ignored --test-threads=1 --nocapture

      # The ladder proves the engine accepts a spec. This proves the *chat path* reaches it: a
      # request that names a profile runs its command inside a real container, writes through the
      # bind mount as the workspace's owner, and is told the sandbox path rather than the host's.
      # A recording runtime cannot see any of that — an embedded `cd /host/checkout` in the command
      # line passed every hermetic test while the command could not have run inside the container.
      - name: The chat path, against a real container
        run: cargo test -p hx-server --test chat_live --locked -- --ignored --test-threads=1 --nocapture

  # A real sshd, a real key, a real handshake. The port is deliberately not 22: the bracketed
  # `[host]:port` form in `known_hosts` is the part most likely to be wrong, and this is the only
  # place it is exercised end to end.
  ssh:
    name: ssh transport (against a real sshd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Start an sshd to test against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"
          cat "$HOME/.ssh/id_ed25519.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo mkdir -p /run/sshd
          # `PerSourcePenalties=no` where the server knows the option: `ssh-keyscan` never
          # authenticates, and OpenSSH >=9.8 penalises that and then resets every later connection,
          # which reads as a transport failure rather than a server policy. Older servers reject the
          # option outright ("Bad configuration option"), so it is added only when supported — the
          # runner image's OpenSSH has been on both sides of 9.8.
          # The probe greps stderr rather than trusting the exit status: `sshd -T` exits 0 here
          # and reports "no hostkeys available", so a status check says "unsupported" for an
          # option the server actually accepts.
          SSH_OPTS="-o PasswordAuthentication=no"
          if ! sshd -T -o PerSourcePenalties=no 2>&1 >/dev/null | grep -q 'Bad configuration'; then
            SSH_OPTS="$SSH_OPTS -o PerSourcePenalties=no"
          fi
          sudo /usr/sbin/sshd -p 2222 $SSH_OPTS
          # Assert readiness here instead of inside a test: "connection refused" from a test looks
          # like a transport bug, when it is really a server that never came up.
          for attempt in $(seq 1 20); do
            if (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null; then
              echo "sshd is listening on 2222"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::sshd did not start on 2222"
          exit 1

      - name: Configure the test target
        # The runner's own user, discovered rather than assumed: a hardcoded name breaks the moment
        # the runner image changes, and the failure would look like an authentication bug.
        run: |
          {
            echo "HX_SSH_TEST_HOST=127.0.0.1"
            echo "HX_SSH_TEST_PORT=2222"
            echo "HX_SSH_TEST_USER=$(id -un)"
            echo "HX_SSH_TEST_KEY=$HOME/.ssh/id_ed25519"
          } >> "$GITHUB_ENV"

      - name: The transport, against a real server
        run: cargo test -p hx-remote --test ssh_live --locked -- --ignored --test-threads=1 --nocapture

      - name: An interactive terminal on the far side of that server
        # A pty is a stream, not a request, so it gets its own suite: the shell has to be *started*
        # and then spoken to, which is a different claim from "a command ran and returned".
        run: cargo test -p hx-remote --test pty_live --locked -- --ignored --test-threads=1 --nocapture

      - name: A client driving that terminal through the daemon
        # The end-to-end one: HTTP create, policy gate, SSH, the pty, the pump, the broadcast and the
        # WebSocket, with every layer real. It found a deadlock the unit tests could not see.
        run: cargo test -p hx-server --test terminal_remote_live --locked -- --ignored --test-threads=1 --nocapture

  # The same SSH transport, but against a real Apple-signed macOS VM. The `ssh` job above runs on an
  # Ubuntu host; that proves `SshHost` against Linux. A GitHub-hosted `macos-latest` runner *is* a
  # Darwin machine, so it is the cheapest way to prove the transport against macOS without Apple hardware
  # (the `dockur/macos` I had needed a 10-30 minute interactive GUI install before sshd even
  # exists; a runner boots in about a minute). The job runs its own SSH server on loopback and points
  # the live suite at it — no third-party service, nothing exposed to the internet.
  #
  # This is deliberately ONE job, kept short: macOS runner minutes cost 10x Linux minutes on some plans,
  # so nothing else in this file is extended to macOS.
  macos-ssh:
    name: ssh transport against Darwin (real macOS runner)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Record the target so the evidence names it
        # A reviewer has to be able to tell this drove a real Mac from the log alone. `sw_vers`
        # prints the exact macOS release; `uname -a` the kernel. Both go into the job summary so
        # they survive without re-running the job.
        run: |
          {
            echo "### Target: a real macOS runner"
            echo ""
            echo "\`\`\`"
            sw_vers
            uname -a
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          sw_vers
          uname -a

      - name: Enable Remote Login, authorize a key, and confirm the server listens
        # The runner has sudo, and its own user is the one we SSH back into, so the whole setup is
        # loopback on the runner. `systemsetup -setremotelogin on` starts `sshd` on port 22 and
        # lets the current user authenticate with a public key once it is in `authorized_keys`.
        run: |
          set -euxo pipefail
          sudo systemsetup -setremotelogin on
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"
          cat "$HOME/.ssh/id_ed25519.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/authorized_keys"
          # Assert readiness here instead of inside a test: "connection refused" from a test looks like
          # a transport bug, when it is really a server that never came up.
          for attempt in $(seq 1 20); do
            if (exec 3<>/dev/tcp/127.0.0.1/22) 2>/dev/null; then
              echo "sshd is listening on 22"
              exit 0
            fi
            sleep 1
          done
          echo "::error::sshd did not answer on 22"
          exit 1

      - name: Configure the test target
        # The runner's own user, discovered rather than assumed: a hardcoded name breaks the moment the
        # runner image changes, and the failure would look like an authentication bug. `HX_SSH_TEST_OS`
        # tells the live suite the probe must report Darwin rather than Linux (see `expected_os` in ssh_live.rs).
        run: |
          {
            echo "HX_SSH_TEST_HOST=127.0.0.1"
            echo "HX_SSH_TEST_PORT=22"
            echo "HX_SSH_TEST_USER=$(id -un)"
            echo "HX_SSH_TEST_KEY=$HOME/.ssh/id_ed25519"
            echo "HX_SSH_TEST_OS=macos"
          } >> "$GITHUB_ENV"

      - name: The transport against Darwin
        # `set -o pipefail` so a failing test fails the job even though we tee the output to a log.
        # The log is what gets uploaded, so the full live output is readable after the run.
        run: |
          set -o pipefail
          cargo test -p hx-remote --test ssh_live --locked -- --ignored --test-threads=1 --nocapture 2>&1 | tee /tmp/ssh-live-darwin.log

      - name: Summarize the evidence
        if: always()
        run: |
          {
            echo "### SSH + SFTP against Darwin: result"
            echo ""
            echo "- macOS: \`$(sw_vers -productVersion)\`"
            echo "- kernel: \`$(uname -r)\`"
            echo "- suite: \`cargo test -p hx-remote --test ssh_live -- --ignored --test-threads=1 --nocapture\` against \`127.0.0.1:22\`"
            echo "- full live output is in the **ssh-live-darwin** artifact"
            echo ""
            echo "Test pass/fail lines from the run:"
            echo ""
            echo "\`\`\`"
            grep -E '^(test result|running|test tests::|test [a-z_]+ \.\.\.)' /tmp/ssh-live-darwin.log || true
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the live output so it can be read without re-running
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ssh-live-darwin
          path: /tmp/ssh-live-darwin.log
