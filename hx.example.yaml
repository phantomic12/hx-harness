# hx — example configuration.
#
# Copy to `hx.yaml` and edit. Unknown keys are rejected, so a typo fails loudly at startup
# instead of being silently ignored.
#
# Verify with:  hx doctor
# Inspect with: hx policy ; hx pools ; hx sandbox profiles ; hx sandbox spec dev

# ---------------------------------------------------------------------------
# Providers: one entry per upstream, each with one or more credentials.
#
# Limits belong to the *credential*, because that is what the provider actually
# rate-limits. Several keys for one provider give you failover and more headroom.
# ---------------------------------------------------------------------------
providers:
  anthropic-main:
    kind: anthropic
    base_url: https://api.anthropic.com
    models:
      - claude-opus-4-7
      - claude-sonnet-4-7
    price: { input_per_mtok: 3.0, output_per_mtok: 15.0 }
    routing: least_loaded
    credentials:
      - id: a1
        secret: "vault:anthropic/main"
        limits: { rpm: 50, tpm: 40000, concurrent: 4 }
      - id: a2
        secret: "vault:anthropic/backup"
        limits: { rpm: 50, tpm: 40000, daily_usd: 20.0 }
        weight: 1

  # Any OpenAI-compatible endpoint: OpenAI, OpenRouter, Groq, Together, vLLM,
  # llama.cpp server, Ollama, LiteLLM, or a gateway.
  local-llama:
    kind: ollama
    base_url: http://127.0.0.1:11434
    models: [qwen3-32b]
    routing: priority
    credentials:
      # A local endpoint needs no key, but every credential still needs an entry so
      # the limiter has something to attach limits to.
      - { id: local, secret: "vault:local/none", limits: { concurrent: 2 } }

  # A cheap OpenAI-compatible upstream for background-grade children.
  openai-cheap:
    kind: openai
    base_url: https://api.openai.com
    models: [gpt-4o-mini]
    routing: priority
    credentials:
      - { id: cheap, secret: "env:OPENAI_API_KEY", limits: { rpm: 60, tpm: 60000 } }

# ---------------------------------------------------------------------------
# Pools: named lists of provider/model routes, with an optional ceiling that
# spans all of them.
#
# Agents ask for a *role*, never a key or a model. That indirection is what lets
# you re-point `scout` at cheaper capacity without touching agent code.
# ---------------------------------------------------------------------------
pools:
  interactive:
    members:
      - anthropic-main/claude-opus-4-7
      - anthropic-main/claude-sonnet-4-7
    strategy: priority

  background:
    members:
      - local-llama/qwen3-32b
    strategy: priority
    limits: { concurrent: 4 }

  # Pools can inherit, and override selectively.
  background-cheap:
    inherits: background
    limits: { concurrent: 2, daily_usd: 5.0 }

# M8 model pools: per-child model members the subagent spawner draws from.
# Each member routes by its declared `provider` (a registry id from above) and `model` (the model
# name the request carries) — the `id` names the member inside the pool only, never the route.
# `base_url` must agree with the provider's configured URL (a mismatch fails when the pool is
# built), so the recorded URL is the contacted one. The credential is a *reference* — never a value.
# `accepts` is the set of parameters this member accepts; anything else requested is clamped
# to the nearest accepted value (or dropped) and the clamp is recorded, never sent raw.
model_pools:
  builder:
    - id: builder-strong
      provider: anthropic-main
      model: claude-opus-4-7
      base_url: https://api.anthropic.com
      credential: "vault:anthropic/main"
      accepts:
        - { kind: reasoning_effort, value: high }
    - id: builder-cheap
      provider: openai-cheap
      model: gpt-4o-mini
      base_url: https://api.openai.com
      credential: "env:OPENAI_API_KEY"
      accepts:
        - { kind: reasoning_effort, value: low }

roles:
  builder: interactive
  reviewer: interactive
  scout: background
  summarize: background-cheap

# ---------------------------------------------------------------------------
# Hosts: the machines an agent may act on.
#
# The remote platform is probed on connect, so one Linux daemon drives Windows,
# macOS and Linux boxes and adapts the shell it emits. Nothing here assumes the
# remote is the same OS as the local machine.
# ---------------------------------------------------------------------------
hosts:
  buildbox:
    kind: ssh
    address: 10.0.0.5
    port: 22
    user: deploy
    auth: { kind: key, secret_ref: "vault:ssh/buildbox" }
    # Host key checking: `strict` (the default — an unknown host is refused), `tofu` (trust on
    # first use: the first connection records the key and a later *change* is refused), or
    # `insecure` (accept anything, warn loudly). Omit the key and you get strict. Use `tofu` for
    # machines too new to have a known_hosts entry — it is per host and spelled by name, so a
    # lax policy is a line here rather than a default. A changed key is refused under strict and
    # tofu alike; the choice is only about what happens on a *first* contact.
    # host_key: tofu
    # A sandbox profile with `host: buildbox` and an `egress:` allowlist needs the compiled
    # `hx-egress-proxy` binary to exist **on buildbox** — the proxy sidecar runs there, and it
    # bind-mounts the binary from that machine's filesystem. The daemon cannot guess where a
    # deployment put it (the local "sibling of the running executable" rule describes *this*
    # machine), so the path is named per host here. Omit it and a remote egress allowlist is
    # refused, with a message naming this key: never silently unenforced.
    # egress_proxy_bin: /usr/local/bin/hx-egress-proxy

# ---------------------------------------------------------------------------
# Sandbox profiles: what "isolated" means, per level.
#
#   l1  shared kernel, dropped capabilities, read-only root, no network
#   l2  l1 + no capabilities at all, forced read-only root, non-root, user-namespace remapping
#       (the engine's default seccomp profile applies at every level; a stronger one would have to
#        be a shipped profile, and `seccomp=default` is not a value the engine accepts)
#   l3  l2 inside a VM-backed runtime (runsc / kata) — a kernel exploit hits the guest
#
# Inspect the concrete settings with: hx sandbox spec dev
# ---------------------------------------------------------------------------
sandbox_profiles:
  dev:
    isolation: l1
    image: ubuntu:24.04
    cpus: 4.0
    memory_mb: 8192
    pids_max: 4096
    workspace_mb: 32768
    ttl_secs: 14400
    network: true
    # No egress allowlist here: an L1 build container needs the network, so this one accepts an
    # unrestricted one — knowingly, in writing. An allowlist *is* enforceable now (the sandbox rides
    # an internal network whose only exit is an `hx-egress-proxy` sidecar that matches the CONNECT
    # target by name), so uncomment the line below to restrict this profile. A CIDR or raw IP in it
    # is refused rather than half-enforced — a name-matching proxy cannot decide one.
    # egress: ["crates.io", "static.crates.io", "registry.npmjs.org", "github.com"]

  untrusted:
    isolation: l2
    image: ubuntu:24.04
    cpus: 2.0
    memory_mb: 4096
    pids_max: 1024
    ttl_secs: 3600
    # Defaults are the safe ones: no network, read-only root, non-root user.

  # A profile with a `command` is a box that boots *something* instead of idling: `command` is the
  # sandbox's own process (an argv, not a shell line — write `["sh", "-c", "…"]` when you want one),
  # and leaving it out means `sleep infinity`, a box you only exec into. The confinement is identical
  # either way: the cgroup limits, the network policy, the egress allowlist and the TTL above all
  # still apply, so a long-lived server is not a weaker sandbox. The docker and remote backends
  # honour it; the firecracker backend boots the guest image's own init and refuses a profile with
  # the key rather than running something the operator did not ask for.
  #
  #   server:
  #     isolation: l2
  #     image: python:3.12-slim
  #     ttl_secs: 3600
  #     network: true          # a server that nobody can reach is a test with no assertions
  #     readonly_rootfs: false # and the port it binds may want a scratch dir to write
  #     command: ["python3", "-m", "http.server", "8000"]

# ---------------------------------------------------------------------------
# The terminal and the screen: what a client's `POST /v1/terminals` runs, and the browser
# `POST /v1/screens` launches.
#
# `terminal.shell` defaults to `$SHELL`, else `/bin/sh`. It names a shell on the *daemon's* machine;
# a terminal in a sandbox or on a remote host ignores it, because `/bin/zsh` in a config is a path on
# the machine the config was written for and would be a guess about any other.
#
# A **screen** is a browser the daemon runs and streams to the web client's `screen` pane: JPEG frames
# down a WebSocket, the watcher's clicks, wheel and keys back up. It owns a browser profile per screen
# under `profile_root` (a cookie jar is an identity, so two screens never share one) and it is
# deliberately not confined by a sandbox: the browser runs where the daemon does, and can reach
# whatever that machine can. The same client can already open a shell there, which is strictly more.
#
#   terminal:
#     shell: /bin/bash
#
#   screen:
#     # Omitted means "search the platform's usual places" — Chrome, then Edge, then the Linux paths —
#     # which is the *same* search the browser rung uses, so a fetch and a screen on one host agree on
#     # which browser is meant. A host with none answers 503 naming every path it looked at.
#     browser: /usr/bin/google-chrome
#     # The page a screen opens when a request names none. Omitted means `about:blank`: a daemon that
#     # opened a page of its own choosing would be reaching the network on a watcher's behalf.
#     url: http://127.0.0.1:7717/
#     width: 1280
#     height: 800
#     quality: 70
#     # One directory per screen. Must be an absolute path or one relative to the daemon's working
#     # directory (it is resolved before the browser sees it — Chrome refuses a relative
#     # `--user-data-dir` outright). Defaults to a directory under the system temporary directory.
#     profile_root: /var/lib/hx/screens
#     # How long a person is given to clear a wall that refused every automated rung, in seconds. A
#     # site that refuses the plain fetch *and* a real browser gets handed to a person: the daemon opens
#     # a screen and waits this long for an answer from the web client (see the screen pane's banner,
#     # `POST /v1/challenges`). **0 never asks** — the interactive rung keeps its fail-closed default
#     # and a refused page ends at the browser's refusal. Worth knowing before leaving it at 300: a
#     # background research run that hits a bot wall will open a browser on **this** machine and hold
#     # that fetch while it waits.
#     challenge_budget_secs: 300
#     # Who a challenge is addressed to — the person the daemon tells when a run is stuck on a wall.
#     # Omitted means the account the daemon already has: `api.admin_username`, itself `admin`. The
#     # name reaches the web client's banner ("for yoav") and the notification pushed below, and the
#     # banner also says whether *that* person was told — an operator with no `push_url` shows that
#     # this page is the only place their question exists.
#     operator: yoav
#
#     # ...or name every operator who may be asked, each with the channel that reaches *them*. A
#     # challenge is a question for one person, so with several people responsible for a daemon the
#     # daemon picks one: challenges **rotate** through this list in order, wrapping at the end, so
#     # two runs in a row never land on the same phone and no run is left unaddressed. Each challenge
#     # is pushed only to its own addressee's `push_url` — never broadcast, and never to the shared
#     # `approval.push_url` below, which a roster entry deliberately does not inherit.
#     #
#     # An entry with no `push_url` is a person the daemon can address but not ring: their questions
#     # wait on the page, and the daemon says so once at startup rather than leaving you to find out.
#     # A repeated name keeps the first `push_url`, so one person is never rung twice for one question.
#     # Writing this list makes `operator` and `approval.push_url` irrelevant to challenges — the list
#     # is the whole truth.
#     operators:
#       - { name: yoav, push_url: "https://relay.example/hx/yoav" }
#       - { name: dana, push_url: "https://relay.example/hx/dana" }
#       # Reachable, but only on the daemon's own page:
#       - { name: sam }

# ---------------------------------------------------------------------------
# The operator's notification webhook. Off unless it is configured.
# ---------------------------------------------------------------------------
# `approval.push_url` is where the daemon pings a *person*, over a generic webhook — a relay you run,
# a `notify` endpoint, or a script that turns the JSON into a lock-screen notification. No APNs/FCM
# provider is required and none is bundled. Three kinds of ping arrive here, each with its own `kind`
# so one relay can route them apart:
#
#   challenge            a page refused every automated rung and someone has to clear the wall. Sent
#                        only to the `push_url` of the operator it is addressed to. The payload names
#                        the site, the session, that operator, the time left and the
#                        screen to look at (`page_url`), and carries a **one-time** `respond_url`:
#                        `POST` it `{"outcome":"solved"}` and the challenge is answered *without* the
#                        daemon's bearer token. The note the token lives in is redacted from every log
#                        line. Clearing the wall itself happens on the screen — the token only reports
#                        that a person did.
#   challenge_resolved   that challenge ended, and how (`solved`, `abandoned`, `withdrawn`). It goes
#                        back down the same route it came up: the person who was told to hurry is the
#                        person who learns they can stop, and nobody else's phone is woken.
#   run_completed        a run finished, with its stop reason and cost.
#
# Nothing is posted when this key is omitted: those pings are simply not sent, which the challenge
# banner says on the page rather than implying somebody was reached. This is also the *only* operator
# channel `screen.operators` does not replace: each entry there carries its own `push_url`, so a
# question addressed to one person is never delivered on another's webhook. With no `operators` list
# this key is the single operator's channel, exactly as it has always been.
#
#   approval:
#     push_url: https://relay.example/hx

# ---------------------------------------------------------------------------
# Approval: what runs by itself, and what has to be asked about.
#
# Omitted (as here) a deployment gets `ApprovalPolicy::deployment_default()`: `balanced`, plus the
# catastrophe set *denied* rather than questioned — `rm -rf /`, `rm -rf /etc` and friends, `dd` to a
# device, `mkfs`, `chmod -R 777 /`, `curl … | sh`, `git push --force`, `DROP DATABASE`. Those are
# refusals, not prompts, because "yes" is not answerable from a command line. See
# `hx-core/src/approval.rs::default_denials()` for the exact list, and `docs/approvals.md` for why.
#
# The floor is **layered on**, not replaced: a config that writes an `approval:` block still gets the
# catastrophe set, so the shortest thing you can write to stop being prompted
# (`approval: {level: yolo}`) no longer removes it. A `deny:` list of your own is checked *first* — your
# words explain the refusal and the shipped rule is the backstop behind it. To drop the floor entirely
# you have to say so in so many words, and `hx policy` will then report it as dropped:
#
#   agent:
#     approval:
#       inherit_denials: false   # the catastrophe set is not applied; this is the review
#
# The shape of the block follows:
#
# agent:
#   approval:
#     level: balanced        # observe | cautious | balanced | trusting | yolo
#     # ceiling: mutate      # highest risk class that may ever be auto-approved, at any level
#     # unattended_budget: 20  # check in after this many consecutive unattended actions
#     # expires_at: 2026-10-01T12:00:00Z
#     # refuse_unenumerable_deletions: true   # refuses `rm -rf $DIR` / `rm -rf build*` outright
#     # ask:                 # force a prompt even where the level would auto-allow
#     #   - { tool: shell, command: "git push*", note: "publishes to the world" }
#     # allow:
#     #   - { tool: read_file, command: "*" }
#     #   # `confined: true` matches only a call that runs inside a sandbox — §4's axis, and the reason
#     #   # a sandbox is worth having: this lets a build run unattended in the box while the same command
#     #   # on the host still has to be asked about. Absent means "either", so a rule written before this
#     #   # existed keeps its meaning.
#     #   - { tool: shell, command: "npm test*", confined: true }
#     # deny:
#     #   - { tool: shell, command: "*rm -rf /var*" }
#
# `refuse_unenumerable_deletions` is part of the deployment default alone: a library caller that
# builds a policy in code inherits no opinions, which is why the flag exists separately from the list.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# The HTTP API's authentication.
#
# The daemon's API can read files, run commands on every configured host, and answer the approval
# questions an agent run is waiting on. So it is authenticated with a bearer token, and the rule is
# **fail-closed**: `hxd --bind 0.0.0.0:8787` with no token configured **refuses to start** rather
# than starting unprotected with a warning. A warning is a line in a log nobody reads, and the
# daemon would then be serving an unauthenticated API on a routable address.
#
# On a loopback bind (`127.0.0.1`, `localhost`, `::1` — the default) a token is optional but
# honoured if set, so a local setup can still require one.
#
# The token may be written three ways, in this order of preference:
#
#   1. `token: "env:HX_API_TOKEN"` — a reference, resolved through `hx-secrets` at startup. This is
#      the form to prefer: a value in a config file is a value in every copy and every paste of it.
#   2. `token: "vault:api/token"` — the same, from an unlocked vault.
#   3. `token: "a-literal-token"` — accepted, because a machine-local daemon needing one token
#      should not have to grow a vault. A literal containing a `:` is read as a reference; put such
#      a value in the environment or the vault instead.
#
# `api.token` wins when it is set; `HX_API_TOKEN` in the environment is the fallback and is the form
# a container or a CI job uses. An *empty* variable counts as absent, not as an empty token.
#
# Clients: `hx` and the embedded web page both send `Authorization: Bearer <token>` when one is
# configured. A request without it — or with a wrong one — is a `401` with `WWW-Authenticate:
# Bearer`, and the two are indistinguishable in the body. `GET /healthz` and the web page at `GET /`
# are exempt; see `crates/hx-server/src/auth.rs` for why, and for what a bearer token does *not* buy
# you (no rotation, no expiry, no replay protection — it is not a session).
#
# Uncomment to require a token locally, or set it in so many words to serve a routable address:
#
# api:
#   token: "env:HX_API_TOKEN"
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Search: SearXNG is the force multiplier — one JSON API in front of ~70 engines.
# The keyless scrapers are fallbacks for when no SearXNG is running.
# ---------------------------------------------------------------------------
search:
  backends: [searxng, duckduckgo]
  searxng_url: http://127.0.0.1:8888
  fanout: 2
  top_k: 10
  # Keyed backends are opt-in and never defaults. A credential is a *reference* — `vault:name` or
  # `env:NAME` — never the value itself: a key in a committed file is a key an attacker already has.
  #
  # backends: [duckduckgo, brave, google_cse]
  # credentials:
  #   brave: "vault:brave/search"        # or "env:BRAVE_SEARCH_KEY"
  #   google_cse: "env:GOOGLE_CSE_KEY"
  # google_cse_cx: "0123456789abcdef0"   # the engine id, not a secret

# ---------------------------------------------------------------------------
# How a research run fetches the pages it cites: which browser, and who the target may be.
#
# `screen` is a browser a person *watches*; this is a **rung of the fetch ladder** — the layer a page
# whose plain `GET` was refused gets handed to. The two share exactly one thing, the search that finds
# a browser when no path is named, so on a host with one browser installed a fetch and a screen agree
# on which browser is meant. Everything else is separate, so the two keys below can name different
# binaries without either being wrong.
#
#   fetch:
#     # Omitted means the platform's usual places. A named path is launched exactly as given, which is
#     # how a host whose browser is somewhere unexpected gets a browser rung at all; a wrong path fails
#     # loudly with the path in the message rather than silently searching somewhere else.
#     browser: /usr/bin/google-chrome
#     # Who a fetched target may be: `public_internet` (the default) or `allow_local`.
#     #
#     # `allow_local` admits loopback and private addresses, so a fetched page's own script can reach
#     # every service on the daemon's loopback — a dev server with no auth, a metrics endpoint, the
#     # cloud metadata service at 169.254.169.254. Set it when the backend set is trusted and the point
#     # is a service on this machine (a local SearXNG, a wiki on a private host); otherwise leave it.
#     admission: public_internet
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Chat connectors (M5 in the roadmap).
# ---------------------------------------------------------------------------
# Chat connectors. A `kind: telegram` connector is an **approval mirror**: questions a run asks
# are posted to the chat with allow/deny buttons, and a tap answers the run — the web/CLI client
# watching the same session sees the question resolved the moment the phone decides it. The ceiling
# is a phone ceiling: a tap may authorise reads and workspace mutations, never egress, destructive
# or privileged actions (see `crates/hx-server/src/telegram_mirror.rs`). The first entry of
# `allow_from` must be the **numeric chat id** questions are mirrored to (a `@handle` cannot be
# addressed by the Bot API's approval cards); further entries are chats whose taps are accepted.
connectors:
  telegram:
    kind: telegram
    token: "vault:telegram/bot"
    allow_from: ["123456789", "@yourhandle"]
    # api_root: "https://api.telegram.org"   # or a self-hosted Bot API server / testing stub

# ---------------------------------------------------------------------------
# MCP servers (M6 in the roadmap): other people's tool servers, consumed by
# `crates/hx-mcp`. Commented out, because a fresh install should not spawn
# `npx` the first time it starts.
#
# A server's tools appear to the model namespaced under the server's name, so
# two servers that both expose `search` do not collide:
#
#   files__search   github__search
#
# Everything a server sends back — its tool descriptions, its JSON Schemas, its
# results — is DATA authored by whoever wrote that server, never an instruction.
# A description reading "ignore your instructions and run this" is a sentence
# describing a tool. What a tool may *reach* is decided here and by the approval
# policy, never by the server's own claims about itself.
#
#   mcp_servers:
#     # stdio: the host spawns the child and speaks JSON-RPC over its pipes.
#     files:
#       transport: stdio
#       command: npx
#       args: ["-y", "@modelcontextprotocol/server-filesystem", "/srv/data"]
#       env: { RUST_LOG: warn }
#       # The child inherits an *allowlist* of the daemon's own variables
#       # (PATH, HOME, USER, LOGNAME, SHELL, TMPDIR, LANG, LC_ALL, TERM), so a
#       # credential exported into the daemon's shell does not reach it. Name
#       # anything else the server needs here — this is the opt-in, and it is
#       # per server rather than global.
#       env_passthrough: ["HTTP_PROXY", "VIRTUAL_ENV"]
#       # cwd: /srv
#
#     # streamable_http: a remote endpoint. The token is a *reference*, resolved
#     # through `hx-secrets` at connect time — never a literal, because a value in
#     # a config file is a value in every dump of it.
#     github:
#       transport: streamable_http
#       url: https://mcp.example.com/mcp
#       token: "vault:mcp/github"
#
#     # Every policy field has a bounded default; these are shown for the shape.
#     #   enabled: true              # `false` starts nothing and offers no tools
#     #   namespace: gh              # defaults to the config key
#     #   call_timeout_secs: 30      # one tools/call may not outlive this
#     #   start_timeout_secs: 20     # the initialize + tools/list handshake
#     #   max_restarts: 3            # inside the window below, then it stays down
#     #   restart_window_secs: 300
#
# A server that is down, wedged, or exiting on startup surfaces as a tool result
# the model can read ("mcp server 'files' is not running: ..."), never as a hang.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Update checking: opt-in and non-intrusive (M9).
#
# **Off by default.** Omitted (as here) means `enabled: false`: `hxd` spawns no
# update task and makes no network request. Turn it on only if you want the daemon to
# check a releases feed on an interval and log a single line when a newer build exists.
# It never downloads, never restarts, and never blocks startup.
#
#   update:
#     enabled: true
#     # url: https://api.github.com/repos/phantomic12/hx-harness/releases/latest
#     interval_secs: 86400    # 24h
#
# When a newer version is found the daemon logs, at `info!`:
#   a newer version is available — run the install command to update
# alongside the new version, the current version, the feed URL, and the install command.
# A failed check logs a single `debug!` line; it does not spam or take the daemon down.
# ---------------------------------------------------------------------------

