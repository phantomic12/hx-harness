# cargo-deny configuration — run by the `deny` job in .github/workflows/ci.yml.
#
# Three questions, in order of how likely they are to be interesting:
#   1. advisories — does any dependency have a known CVE?
#   2. licenses   — is everything in the tree redistributable under our MIT license?
#   3. bans/sources — did anything arrive from an unexpected registry or git remote?

[advisories]
version = 2
# A yanked crate still resolves for anyone with a lockfile; failing the build over one
# would block unrelated work. Warn, so it gets seen and fixed deliberately.
yanked = "warn"

# Deliberate, documented exceptions. Keep this list short and keep the reasoning inline —
# a bare ID here is indistinguishable from someone silencing a real problem.
ignore = [
    # Marvin Attack — non-constant-time RSA private-key operations expose key material
    # through timing observable over the network.
    #
    # Not fixable on our side: upstream has no patch. RUSTSEC lists `patched = []` on
    # purpose, and both the latest stable (0.9.10) and the 0.10 release candidate are
    # affected. It reaches us via russh -> ssh-key, and russh is how hx-remote speaks SSH,
    # so the dependency is load-bearing rather than incidental.
    #
    # Exposure is real but narrow: it concerns RSA key operations observable by the remote
    # peer, i.e. an untrusted SSH *server* attacking an hx client that authenticates with an
    # RSA key. Ed25519 keys do not take the affected path at all. Since hx is an SSH client
    # talking to hosts the operator names, the practical risk is a host you already chose to
    # trust turning hostile.
    #
    # Revisit when RustCrypto/RSA#626 lands constant-time padding.
    "RUSTSEC-2023-0071",
    # proc-macro-error 1.0.4 is unmaintained (maintainer unreachable; RUSTSEC notes it
    # also pins syn 1.x). It reaches us via glib-macros/gtk3-macros, i.e. the gtk stack,
    # so it is load-bearing rather than incidental. Alternatives (manyhow,
    # proc-macro2-diagnostics) would require upstream gtk-rs to migrate first.
    # Revisit if gtk-rs moves off proc-macro-error.
    "RUSTSEC-2024-0370",
    # The rust-unic family (unic-*) is unmaintained as a whole (rustsec/advisory-db#2414).
    # It reaches us as a chain — urlpattern -> unic-ucd-ident -> unic-ucd-version /
    # unic-char-property -> unic-char-range -> unic-common — via tauri-utils (tauri).
    # Unicode identifier tables are static data; unmaintained here means no new Unicode
    # versions, not a live defect. Revisit if urlpattern/tauri migrate to icu_properties
    # or unicode-ident.
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
]

[licenses]
version = 2
# Permissive-only. Anything copyleft (GPL/AGPL/LGPL) is absent on purpose: hx ships as a
# binary, so a copyleft dependency would impose obligations on the distributed artifact.
#
# `OpenSSL` and `ISC` are here for aws-lc-rs/ring, which carry the OpenSSL exception and
# ISC respectively rather than a bare Apache/MIT.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # MPL-2.0 is weak (file-level) copyleft, not viral like GPL/AGPL: combining MPL-2.0
    # files into a larger binary does not impose copyleft on our own code, so it is
    # compatible with shipping hx as a binary. In the tree via the dom_query/css stack
    # (cssparser, cssparser-macros, selectors, dtoa-short) and dirs-sys (option-ext).
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Every entry above is justified by an actual dependency — cargo-deny flags allowances that
# match nothing ("license-not-encountered"), which is how MPL-2.0, OpenSSL and
# Unicode-DFS-2016 were found to be dead here. If a dependency update introduces a new
# license, this check fails naming it, and adding a line is the deliberate review step.
# Some crates ship no license field or a non-SPDX string. Fail loudly rather than
# silently accepting a license we never reviewed.
confidence-threshold = 0.93

[bans]
# 395 crates in the tree, so duplicates are a fact of life, not an incident.
multiple-versions = "warn"
# A wildcard version requirement means the build is not reproducible. Path dependencies
# (`hx-core = { path = "crates/hx-core" }`) declare no version and would trip this, so
# they are exempted explicitly.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# A crate from an unknown registry is a supply-chain problem worth stopping for.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Nothing is pulled from git today. If that changes, add the specific remote here — never
# a wildcard, which would make this section decorative.
allow-git = []
